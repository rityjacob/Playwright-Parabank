[pytest]
pythonpath = .
testpaths = tests
addopts = --base-url https://parabank.parasoft.com/parabank
    ; -v
    ; --html=reports/report.html
    ; --self-contained-html
markers =
    smoke: smoke tests
    regression: regression tests
    negative: negative / error-path tests
    api: API-level tests using Playwright's APIRequestContext